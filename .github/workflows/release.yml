name: Release

on:
    push:
        branches: [main]

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    select-mode:
        runs-on: ubuntu-latest
        outputs:
            mode: ${{ steps.select-mode.outputs.mode }}
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Select Changesets mode
              id: select-mode
              uses: changesets/action/select-mode@v2

    version:
        if: needs.select-mode.outputs.mode == 'version'
        needs: select-mode
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Version packages
              uses: changesets/action/version@v2
              with:
                  script: npm run version-packages

    publish:
        if: needs.select-mode.outputs.mode == 'publish'
        needs: select-mode
        runs-on: ubuntu-latest
        environment: npm-publish
        permissions:
            contents: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: npm ci

            - name: Publish packages
              uses: changesets/action/publish@v2
              with:
                  script: npm run release
